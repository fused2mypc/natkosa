<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nat y Kosa's Webhouse</title>

  <link href="https://fonts.googleapis.com/css2?family=Knewave&family=Kodchasan:wght@300;400&family=Lacquer&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="container">

    <section class="window window-wide">
      <div class="window-header">
        <h1>Nat y Kosa's Webhouse</h1>
      </div>
      <div class="window-body banner no-padding">
        <div class ="media">
            <img src="assets/banner.JPEG" alt="banner" />
        </div>
      </div>
    </section>

    <section class="grid">

      <div class="window">
        <div class="window-header">updates</div>
        <div class="window-body">
          <p><strong>May 05 2026</strong></p>
          <p>site launch! HAPPY ONE YEAR BABY!!!!! &lt;3</p>
        </div>
      </div>

    <div class="window">
      <div class="window-header">currently</div>
      <div class="window-body">
        <p><img src="assets/icons/love.webp" class="icon"> celebrating one year anni</p>
        <p><img src="assets/icons/tv2.webp" class="icon"> watching Breaking Bad</p>
        <p><img src="assets/icons/game.webp" class="icon"> playing Undertale</p>
      </div>
    </div>

    <div class="window tall">
        <div class="window-header">guestbook</div>

        <div class="window-body">
            <p class="guestbook-name">Feature coming soon!</p>
        </div>

        <div class="window-footer">
            &gt; type here
        </div>
    </div>

      <div class="window square">
        <div class="window-header">Kiki</div>
        <div class="window-body no-padding">
            <div class="media">
                <a href="gallery.html?type=kiki">
                <img src="assets/kiki/kiki11.webp" alt="webp" />
                </a>
            </div>
        </div>
        </div>

      <div class="window square">
        <div class="window-header">Photo Album</div>
        <div class="window-body no-padding">
            <div class="media">
                <a href="gallery.html?type=album">
                    <img src="assets/us/us14.webp" alt="album preview" />
                </a>
            </div>
        </div>
        </div>

    </section>

    <footer class="site-footer">
      dedicated to mi natashka :*
    </footer>

  </main>

</body>
</html>
